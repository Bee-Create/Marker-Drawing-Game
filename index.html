<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Markers</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Marker Drawing Game</h1>

<div class="container" aria-label="Choose a marker color">
  <button class="marker red selected" data-color="#e63946"
          aria-label="Red marker" aria-pressed="true">
    <span class="cap"></span><span class="sleeve"></span>
  </button>
  <button class="marker green" data-color="#2a9d55"
          aria-label="Green marker" aria-pressed="false">
    <span class="cap"></span><span class="sleeve"></span>
  </button>
  <button class="marker blue" data-color="#3564df"
          aria-label="Blue marker" aria-pressed="false">
    <span class="cap"></span><span class="sleeve"></span>
  </button>
</div>

<div class="drawing-controls">
  <label for="brush-size">Brush size</label>
  <input id="brush-size" type="range" min="2" max="40" value="10">
  <button id="clear-button" type="button">Clear canvas</button>
</div>

<canvas id="drawing-canvas" aria-label="Drawing canvas"></canvas>

<script src="script.js"></script>
  </body>
</html>
